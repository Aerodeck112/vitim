name: VITIM AI Cloud

on:
  push:
    branches: [main]
    paths: ['cloud/**', '.github/workflows/cloud.yml']
  pull_request:
    paths: ['cloud/**', '.github/workflows/cloud.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: cloud

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: vitim_ai_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, mbstring, intl, sodium, zip
          coverage: none
      - name: Dependențe
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Stil (Pint)
        run: vendor/bin/pint --test
      - name: Pregătire
        run: cp .env.example .env && php artisan key:generate
      - name: Teste (SQLite)
        run: php artisan test
      - name: Teste (MySQL 8)
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: vitim_ai_test
          DB_USERNAME: root
          DB_PASSWORD: root
